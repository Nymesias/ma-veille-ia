name: Lancer Veille RSS

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installation des dépendances
        run: pip install requests feedparser markdown

      - name: Exécution du script de veille
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python veille.py

      - name: Sauvegarder les résultats sur GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. On force l'ajout des fichiers de données
          git add markdown/ liste_md.json liste_rss.json
          
          # 2. On commit seulement s'il y a des changements
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Mise à jour automatique de la veille 🤖"
            
            # 3. LE PUSH FORCÉ : On envoie vers le dépôt sans faire de pull.
            # Cela écrase la version distante par celle que le robot vient de créer.
            git push origin veille --force
          else
            echo "Aucun changement détecté, rien à sauvegarder."
          fi