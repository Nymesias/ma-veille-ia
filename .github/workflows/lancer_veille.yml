name: Ma Veille IA Quotidienne

on:
  schedule:
    # 01:23 UTC, soit 02:23 à Paris en hiver et 03:23 en été.
    - cron: '23 1 * * *'
  workflow_dispatch:      # Permet de lancer le script manuellement

permissions:
  contents: write

concurrency:
  group: veille-quotidienne
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # --- 1. RÉCUPÉRATION DU DÉPÔT ---
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # --- 2. INSTALLATION ---
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          pip install feedparser requests markdown beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      # --- 3. LE SCRIPT (Génère MD + Envoie Mail) ---
      - name: Lancer la veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GEMINI_DEGRADED_MODEL: 'gemini-3.6-flash'
          GEMINI_MAX_RETRIES: '2'
          GEMINI_FALLBACK_MODELS: ''
          GEMINI_MIN_REQUEST_INTERVAL: '60'
          GEMINI_RETRY_BASE_SECONDS: '60'
          TZ: Europe/Paris
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python -u veille.py

      - name: Archiver les sorties disponibles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veille-quotidienne-${{ github.run_id }}
          path: |
            markdown/
            *.json
          if-no-files-found: warn
          retention-days: 14

      # --- 4. LE PUSH (Sauvegarde les nouveaux fichiers) ---
      - name: Sauvegarder sur le serveur
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markdown *.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Veille auto : synthèses et listes à jour"
            git push
          fi
