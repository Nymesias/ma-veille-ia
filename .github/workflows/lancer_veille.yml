name: Lancer Veille RSS

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installation des dépendances
        run: pip install requests feedparser markdown

      - name: Exécution du script de veille
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python ton_script_ia.py

      - name: Commit et Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # On récupère les modifs pour être sûr d'être à jour
          git pull origin veille --rebase
          
          # On ajoute les modifs des JSON et des nouveaux MD
          git add -f liste_md.json liste_rss.json markdown/*.md
          
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Mise à jour des archives : $(date +'%Y-%m-%d')"
            git push origin veille
          else
            echo "Aucun changement détecté."
          fi