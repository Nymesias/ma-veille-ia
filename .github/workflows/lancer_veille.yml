name: Lancer Veille RSS

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère tout l'historique

      - name: Synchronisation avant calcul
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # On récupère les derniers fichiers Markdown ou modifs de code
          git pull origin veille --rebase 

      - name: Lancer la veille (Synthèse + Mail + JSON)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python veille.py

      - name: Sauvegarder sur le serveur
        run: |
          # On ajoute tout : nouveaux MD et JSON écrasés
          git add markdown/*.md *.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Veille auto : Nouvelle synthèse et listes à jour"
            git push origin veille --force-with-lease 
          fi