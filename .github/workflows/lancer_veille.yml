name: Update Veille RSS

on:
  schedule:
    # S'exécute tous les jours à 8h00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Permet de lancer le script manuellement

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run script
        env:
          # C'est ici qu'on fait le lien entre GitHub Secret et ton Python
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python veille.py  # Remplace par le nom de ton fichier

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # On vérifie s'il y a vraiment des changements à commiter
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour auto : $(date +'%Y-%m-%d')" && git pull --rebase origin veille && git push origin veille)