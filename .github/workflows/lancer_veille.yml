name: Ma Veille IA Quotidienne

on:
  schedule:
    # 02:23 UTC évite les heures pleines et les créneaux européens les plus chargés
    # (04:23 à Paris en été, 03:23 en hiver).
    - cron: '23 2 * * *'
  workflow_dispatch:      # Permet de lancer le script manuellement

permissions:
  contents: write

concurrency:
  group: veille-quotidienne
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # --- 1. RÉCUPÉRATION DU DÉPÔT ---
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # --- 2. INSTALLATION ---
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          pip install feedparser requests markdown beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      # --- 3. LE SCRIPT (Génère MD + Envoie Mail) ---
      - name: Lancer la veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          # Trois tentatives au total. Les pauses longues laissent passer les
          # pointes temporaires de charge Gemini (HTTP 503 / timeouts).
          tentative=1
          for attente in 0 300 900; do
            if [ "$attente" -gt 0 ]; then
              echo "Nouvelle tentative dans $((attente / 60)) minute(s)..."
              sleep "$attente"
            fi

            echo "Tentative ${tentative}/3"
            if python veille.py; then
              exit 0
            fi

            if [ "$tentative" -eq 3 ]; then
              echo "La veille a échoué après 3 tentatives."
              exit 1
            fi
            tentative=$((tentative + 1))
          done

      # --- 4. LE PUSH (Sauvegarde les nouveaux fichiers) ---
      - name: Sauvegarder sur le serveur
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markdown *.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Veille auto : synthèses et listes à jour"
            git push
          fi
