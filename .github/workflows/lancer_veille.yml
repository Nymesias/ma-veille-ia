name: Lancer Veille RSS

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Installation des dépendances
        run: pip install requests feedparser markdown

      - name: Exécution du script de veille
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python veille.py

      - name: Sauvegarder les résultats sur GitHub
        run: |
          # 1. Configurer l'identité du bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 2. Ajouter les nouveaux fichiers (synthèses et JSON)
          git add markdown/ liste_md.json liste_rss.json
          
          # 3. On vérifie s'il y a des changements avant de commit
          # (évite l'erreur "nothing to commit" qui fait planter l'action)
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Mise à jour automatique de la veille 🤖"
            git push
          else
            echo "Aucun changement détecté, rien à sauvegarder."
          fi