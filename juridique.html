<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Veille Personnalisée</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <h1>Veille spécialisée</h1> 
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="finance.html">Finance</a></li>
                <li><a href="juridique.html">Juridique</a></li>
                <li><a href="cour-cassation.html">Cour de Cassation</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="tabs-bar">
            <button class="tab-btn active" onclick="piloterOnglet(this, 'Textes Officiels')">Textes Officiels</button>
            <button class="tab-btn" onclick="piloterOnglet(this, 'Revues')">Revues</button>
            <button class="tab-btn" onclick="piloterOnglet(this, 'Blogs')">Blogs</button>
            <button class="tab-btn" onclick="piloterOnglet(this, 'Juridictions')">Juridictions</button>
            <button class="tab-btn" onclick="piloterOnglet(this, 'Analyse')">Analyse</button>
        </div>

        <div style="text-align: right; margin-bottom: 20px;">
            <span style="font-size: 0.8em; color: #666;">Trier par : </span>
            <button onclick="changerTriJuridique('date')" id="btn-date" class="btn-tri active">🕒 Date</button>
            <button onclick="changerTriJuridique('source')" id="btn-source" class="btn-tri">🏢 Source</button>
        </div>

        <div id="juridique-content" class="grille-veille">
            <p>Initialisation des flux...</p>
        </div>
    </main>

<script src="rss-reader.js"></script>
<script>
    // --- VARIABLES D'ÉTAT ---
    // On garde en mémoire l'onglet et le tri choisis par l'utilisateur
    let ongletActif = 'Textes Officiels'; 
    let triActuel = 'date';

    // --- FONCTION POUR LES ONGLETS (Textes, Revues, Blogs...) ---
    async function piloterOnglet(btn, categorie) {
        // 1. Mise à jour visuelle des onglets
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // 2. Mise à jour de l'état
        ongletActif = categorie;
        
        // 3. Chargement des données de CET onglet avec le tri ACTUEL
        if (ongletActif === 'Analyse') {
            await chargerAnalyseJuridique();
            return;
        }
        console.log(`Chargement de ${ongletActif} trié par ${triActuel}`);
        document.getElementById('juridique-content').classList.add('grille-veille');
        document.getElementById('juridique-content').classList.remove('post-md');
        await chargerFluxRSS(ongletActif, 'juridique-content', triActuel);
    }

    async function chargerAnalyseJuridique() {
        const container = document.getElementById('juridique-content');
        container.classList.remove('grille-veille');
        container.classList.add('post-md');
        container.innerHTML = "<p style='text-align:center;'>Chargement de l'analyse...</p>";
        try {
            const res = await fetch('liste_md.json');
            if (!res.ok) throw new Error('Liste indisponible');
            const fichiers = await res.json();
            const analyse = fichiers.find(f => f.nom_fichier.toLowerCase().includes('juridique-analyse'));
            if (!analyse) {
                container.innerHTML = "<p>Aucune analyse juridique disponible.</p>";
                return;
            }
            const mdRes = await fetch(`markdown/${analyse.nom_fichier}`);
            if (!mdRes.ok) throw new Error('Analyse indisponible');
            const texte = await mdRes.text();
            container.innerHTML = `
                <span class="date">Analyse du ${analyse.date_affichage}</span>
                <div class="article-body">${marked.parse(texte)}</div>
            `;
        } catch (erreur) {
            console.error('Erreur analyse juridique :', erreur);
            container.innerHTML = "<p>Impossible de charger l'analyse juridique.</p>";
        }
    }

    // --- FONCTION POUR LES BOUTONS DE TRI (Date, Source) ---
    async function changerTriJuridique(mode) {
        // 1. Mise à jour de l'état
        console.log("Mode cliqué :", mode); // Vérifie si ça s'affiche dans la console (F12)
    triActuel = mode;

    const btnDate = document.getElementById('btn-date');
    const btnSource = document.getElementById('btn-source');

    if (mode === 'date') {
        btnDate.classList.add('active');
        btnSource.classList.remove('active');
    } else {
        btnSource.classList.add('active');
        btnDate.classList.remove('active');
    }

    if (ongletActif === 'Analyse') {
        await chargerAnalyseJuridique();
    } else {
        document.getElementById('juridique-content').classList.add('grille-veille');
        document.getElementById('juridique-content').classList.remove('post-md');
        await chargerFluxRSS(ongletActif, 'juridique-content', mode);
    }
}

    // --- DÉMARRAGE ---
    window.onload = async () => {
        // On initialise le projet (chargement du JSON)
        await initialiserProjet();
        // On affiche le premier onglet par défaut (trié par date)
        await chargerFluxRSS(ongletActif, 'juridique-content', 'date');
    };
</script>
</body>
</html>
