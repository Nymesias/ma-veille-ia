<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Veille Personnalisée</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <h1>Ma Veille Personnalisée</h1>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Accueil</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="finance.html">Finance</a></li>
                <li><a href="juridique.html">Juridique</a></li>
                <li><a href="cour-cassation.html">Cour de Cassation</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="tabs-bar">
            <button id="btn-default" class="tab-btn active" onclick="piloterOnglet(this, 'jour')">Synthèse du jour</button>
            <button class="tab-btn" onclick="piloterOnglet(this, 'archives')">Archives</button>
        </div>

        <div id="container-synthese" class="tab-content post-md">
            </div>

        <div id="container-archives" class="tab-content" style="display: none;">
            <div class="archives-layout">
                <div class="archives-sidebar">
                    <div class="search-box">
                        <input type="text" id="archiveSearch" placeholder="Rechercher..." onkeyup="filtrerArchives()">
                    </div>
                    <div id="archives-list" class="archives-list">
                        </div>
                </div>

                <div class="archives-viewer" id="viewer-md">
                    <div class="viewer-placeholder">
                        <span style="font-size: 3rem;">📖</span>
                        <p>Sélectionnez un journal dans la liste pour le lire</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

<script>

let toutesLesSyntheses = [];
let cacheContenu = {};

async function initialiserPage() {
    const zoneJour = document.getElementById('container-synthese');
    const listeArchives = document.getElementById('archives-list');
    const aujourdhui = new Date().toISOString().split('T')[0];

    try {
        const res = await fetch('liste_md.json');
        const data = await res.json();
        
        // On stocke globalement pour les filtres
        toutesLesSyntheses = data.filter(a => a.nom_fichier.split('/').pop().startsWith('synthese-'));

        // 1. GESTION DU JOUR
        const syntheseDuJour = toutesLesSyntheses.find(s => s.date_tri === aujourdhui);
        if (syntheseDuJour) {
            chargerFichierDansZone(syntheseDuJour, zoneJour);
        } else {
            zoneJour.innerHTML = `
                <div style="text-align:center; padding: 50px;">
                    <span style="font-size: 3rem;">⏳</span>
                    <p>Le journal du <strong>${aujourdhui}</strong> n'a pas encore été généré.</p>
                </div>`;
        }

        // 2. GESTION DE LA LISTE DES ARCHIVES (Colonne gauche)
        // On exclut le jour même de la liste des archives pour éviter les doublons
        const archives = toutesLesSyntheses.filter(s => s.date_tri !== aujourdhui);
        
        listeArchives.innerHTML = "";
        if (archives.length === 0) {
            listeArchives.innerHTML = "<p style='padding:15px; font-size:0.8rem;'>Aucune archive.</p>";
        } else {
            archives.forEach(info => {
                const item = document.createElement('div');
                item.className = 'archive-item';
                item.innerHTML = `<strong>Journal du ${info.date_affichage}</strong>`;
                
                // Au clic, on lit dans le viewer de droite
                item.onclick = () => lireDansViewer(info, item);
                
                listeArchives.appendChild(item);
            });
        }

    } catch (e) {
        console.error("Erreur:", e);
        zoneJour.innerHTML = "<p style='color:red; text-align:center;'>Erreur de chargement des données.</p>";
    }
}

async function lireDansViewer(info, elementClique) {
    const viewer = document.getElementById('viewer-md');
    const query = document.getElementById('archiveSearch').value.trim();
    
    document.querySelectorAll('.archive-item').forEach(el => el.classList.remove('active'));
    elementClique.classList.add('active');

    let texteBrut = cacheContenu[info.nom_fichier] || "";
    if (!texteBrut) {
        const res = await fetch(`markdown/${info.nom_fichier}`);
        texteBrut = await res.text();
        cacheContenu[info.nom_fichier] = texteBrut;
    }
    
    let htmlRendu = marked.parse(texteBrut);

    if (query.length > 2) {
        // On entoure le mot clé avec un ID pour le scroll : id="match-focus"
        const regex = new RegExp(`(${query})`, 'gi');
        htmlRendu = htmlRendu.replace(regex, '<mark id="match-focus">$1</mark>');
    }

    viewer.innerHTML = `
        <div class="post-md" style="box-shadow:none; border:none; padding:0; margin:0;">
            <span class="date">📅 Journal du ${info.date_affichage}</span>
            <div class="article-body">${htmlRendu}</div>
        </div>
    `;

    // --- LOGIQUE DE SCROLL À LA LIGNE ---
    const premierMatch = viewer.querySelector('#match-focus');
    if (premierMatch) {
        // On attend un tout petit peu que le rendu HTML soit fini
        setTimeout(() => {
            premierMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 50);
    } else {
        viewer.scrollTop = 0;
    }
}

// Variable pour stocker le contenu des fichiers déjà chargés en cache 
// pour ne pas les re-télécharger à chaque lettre tapée
async function filtrerArchives() {
    const input = document.getElementById('archiveSearch');
    const query = input.value.toLowerCase().trim();
    const items = document.querySelectorAll('.archive-item');
    const aujourdhui = new Date().toISOString().split('T')[0];
    const archivesData = toutesLesSyntheses.filter(s => s.date_tri !== aujourdhui);

    // --- RÉINITIALISATION : Si le champ est vide ou < 3 lettres ---
    if (query.length < 3) {
        items.forEach(item => item.style.display = "block");
        return; // On arrête là pour ne pas lancer de fetch inutiles
    }

    // --- RECHERCHE MULTI-ARTICLES ---
    for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const info = archivesData[i];
        if (!info) continue;

        // Charger dans le cache si nécessaire
        if (!cacheContenu[info.nom_fichier]) {
            try {
                const res = await fetch(`markdown/${info.nom_fichier}`);
                cacheContenu[info.nom_fichier] = await res.text();
            } catch (e) { continue; }
        }

        const texteComplet = cacheContenu[info.nom_fichier].toLowerCase();

        // On affiche l'item si le mot est dans la DATE ou dans le CONTENU
        if (texteComplet.includes(query) || item.textContent.toLowerCase().includes(query)) {
            item.style.display = "block";
        } else {
            item.style.display = "none";
        }
    }
}

function piloterOnglet(btn, mode) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const zoneJour = document.getElementById('container-synthese');
    const zoneArchives = document.getElementById('container-archives');

    if (mode === 'jour') {
        zoneJour.style.display = 'block';
        zoneArchives.style.display = 'none';
    } else {
        zoneJour.style.display = 'none';
        zoneArchives.style.display = 'flex'; // Utiliser flex pour le layout split
    }
}

async function chargerFichierDansZone(info, zone) {
    try {
        const reponse = await fetch(`markdown/${info.nom_fichier}`);
        const buffer = await reponse.arrayBuffer();
        const texteBrut = new TextDecoder('utf-8').decode(buffer);
        zone.innerHTML = `
            <span class="date">📅 Journal du ${info.date_affichage}</span>
            <div class="article-body">${marked.parse(texteBrut)}</div>
        `;
    } catch (e) {
        zone.innerHTML = "<p>Erreur de lecture du fichier.</p>";
    }
}

window.onload = initialiserPage;
</script>

</body>
</html>
