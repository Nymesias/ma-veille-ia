<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Veille Personnalisée - Finance</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Styles pour les boutons de tri */
        .btn-tri { 
            background-color: #fff !important; 
            border: 1px solid #3498db !important; 
            color: #3498db !important; 
            padding: 5px 15px; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: 0.3s;
            font-size: 0.85em;
            margin-left: 5px;
        }
        .btn-tri.active { 
            background-color: #3498db !important; 
            color: #fff !important; 
        }
    </style>
</head>
<body>
    <header>
        <h1>Veille thématique</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="finance.html" class="active">Finance</a></li>
                <li><a href="juridique.html">Juridique</a></li>
                <li><a href="cour-cassation.html">Cour de Cassation</a></li>
            </ul>
        </nav>
    </header>

<main>
    <div class="tabs-bar" style="text-align: center; margin-bottom: 30px;">
        <button class="tab-btn active" onclick="basculerOnglet(this, 'MD', 'finance')">Comptes-rendus</button>
        <button class="tab-btn" onclick="basculerOnglet(this, 'RSS', 'finance')">Flux RSS</button>
    </div>

    <div id="barre-tri-finance" style="text-align: right; margin-bottom: 20px; display: none;">
        <span style="font-size: 0.8em; color: #666;">Trier par : </span>
        <button onclick="changerTriFinance('date')" id="btn-date" class="btn-tri active">🕒 Date</button>
        <button onclick="changerTriFinance('source')" id="btn-source" class="btn-tri">🏢 Source</button>
    </div>

    <div id="zone-finance"></div>
</main>

<script src="rss-reader.js?v=20260712-1"></script>
<script>
    // Variables de contrôle pour la page Finance
    let modeTriFinance = 'date'; 
    let ongletActuelFinance = 'finance'; // La clé de ton JSON

    async function basculerOnglet(btn, type, param) {
        // 1. Visuel des onglets
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const zone = document.getElementById('zone-finance');
        const barreTri = document.getElementById('barre-tri-finance');
        
        zone.innerHTML = "<p style='text-align:center;'>Chargement...</p>";
        ongletActuelFinance = param; // Sauvegarde 'finance'

        if (type === 'MD') {
            if(barreTri) barreTri.style.display = 'none';
            zone.className = "lecture-md";
            await chargerMarkdown(param, 'zone-finance');
        } else {
            if(barreTri) barreTri.style.display = 'block';
            zone.className = "grille-veille";
            // APPEL CRUCIAL : on passe bien les 3 infos
            await chargerFluxRSS(ongletActuelFinance, 'zone-finance', modeTriFinance);
        }
    }

    async function changerTriFinance(mode) {
        console.log("Changement de tri demandé :", mode);
        modeTriFinance = mode; 

        // 1. Bascule visuelle du bleu
        const bDate = document.getElementById('btn-date');
        const bSource = document.getElementById('btn-source');
        
        if (mode === 'date') {
            bDate.classList.add('active');
            bSource.classList.remove('active');
        } else {
            bSource.classList.add('active');
            bDate.classList.remove('active');
        }

        // 2. RECHARGEMENT FORCÉ
        // On utilise explicitement 'finance' et 'zone-finance'
        await chargerFluxRSS('finance', 'zone-finance', mode);
    }

    window.onload = async () => {
        if (typeof initialiserProjet === "function") await initialiserProjet();
        const btnDefaut = document.querySelector('.tab-btn.active');
        await basculerOnglet(btnDefaut, 'MD', 'finance');
    };
</script>
</body>
</html>
