<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Veille Personnalisée - Cour de Cassation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <h1>Actualités de la Cour de Cassation</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="finance.html">Finance</a></li>
                <li><a href="juridique.html">Juridique</a></li>
                <li><a href="cour-cassation.html" class="active">Cour de Cassation</a></li>
            </ul>
        </nav>
    </header>

    <main id="cassation-content">
        <p style="text-align:center;">Chargement des analyses juridiques...</p>
    </main>

    <script src="rss-reader.js"></script>
    <script>
        async function chargerAnalysesCassation() {
            const zone = document.getElementById('cassation-content');
            
            try {
                // 1. On charge la liste centralisée (liste_md.json est à la racine)
                const res = await fetch('liste_md.json');
                const fichiers = await res.json();
                
                // 2. On filtre pour ne garder que la Cour de Cassation
                const articlesFiltres = fichiers.filter(f => 
                    f.nom_fichier.toLowerCase().includes('cour-de-cassation') || 
                    f.nom_fichier.toLowerCase().includes('cassation')
                );

                if (articlesFiltres.length === 0) {
                    zone.innerHTML = "<p style='text-align:center;'>Aucune analyse disponible pour la Cour de Cassation.</p>";
                    return;
                }

                zone.innerHTML = ""; // On efface le message de chargement

                // 3. Boucle d'affichage
                for (const item of articlesFiltres) {
                    const resMd = await fetch('markdown/' + item.nom_fichier);
                    
                    // Gestion des accents (UTF-8)
                    const buffer = await resMd.arrayBuffer();
                    const decoder = new TextDecoder('utf-8');
                    const texteBrut = decoder.decode(buffer);

                    zone.innerHTML += `
                        <article class="post-md" style="margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px;">
                            <small style="color: #2980b9; font-weight: bold;">Publié le ${item.date_affichage}</small>
                            <div class="article-body" style="margin-top: 15px;">
                                ${marked.parse(texteBrut)}
                            </div>
                        </article>`;
                }
            } catch (e) {
                console.error("Erreur Cassation:", e);
                zone.innerHTML = "<p style='text-align:center; color:red;'>Erreur lors du chargement des articles.</p>";
            }
        }

        // Lancement au chargement de la page
        window.onload = chargerAnalysesCassation;
    </script>
</body>
</html>
